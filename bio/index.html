  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <style>
    .bio-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px;
    }
    .bio-mark {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      color: var(--gold);
      font-size: 1rem;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    .bio-name {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }
    .bio-tagline {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 8px;
      text-align: center;
    }
    .bio-links {
      width: 100%;
      max-width: 440px;
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bio-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border: 1px solid var(--line);
      background: var(--bg-raised);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: border-color 0.25s var(--ease), transform 0.25s var(--ease), background 0.25s var(--ease);
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.6s var(--ease) forwards;
    }
    .bio-link:hover {
      border-color: var(--gold);
      background: var(--surface);
      transform: translateX(4px);
    }
    .bio-link .arrow { color: var(--gold); }

    .bio-link:nth-child(1)  { animation-delay: 0.05s; }
    .bio-link:nth-child(2)  { animation-delay: 0.10s; }
    .bio-link:nth-child(3)  { animation-delay: 0.15s; }
    .bio-link:nth-child(4)  { animation-delay: 0.20s; }
    .bio-link:nth-child(5)  { animation-delay: 0.25s; }
    .bio-link:nth-child(6)  { animation-delay: 0.30s; }
    .bio-link:nth-child(7)  { animation-delay: 0.35s; }
    .bio-link:nth-child(8)  { animation-delay: 0.40s; }

    .bio-footer {
      margin-top: 56px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
      text-transform: uppercase;
      text-align: center;
    }
    .bio-footer a { color: var(--ink-faint); }
    .bio-footer a:hover { color: var(--gold); }
  </style>
</head>
<body>

  <div class="bio-page">
    <div class="bio-mark">DFN</div>
    <div class="bio-name">Suave Melodies</div>
    <div class="bio-tagline">Discipline From Nothing</div>

    <nav class="bio-links">
